services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: quality
      POSTGRES_DB: quality_report
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality -d quality_report"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
